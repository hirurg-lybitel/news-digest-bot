<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta
      name="description"
      content="World news digest — Day Essence / Мировые новости · Суть дня. Twice-daily top stories from BBC, NYT, Guardian and more. Telegram: t.me/dayessence_en · t.me/dayessence_ru"
    />
    <title>Day Essence · World News Digest</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app" class="app">
      <header class="header">
        <div class="header-top">
          <h1 id="brand" class="brand">Day Essence</h1>
          <div class="lang-switch" role="group" aria-label="Language">
            <button type="button" class="lang-btn" data-lang="ru">RU</button>
            <button type="button" class="lang-btn" data-lang="en">EN</button>
          </div>
        </div>
        <p id="date" class="date"></p>
        <p id="intro" class="intro"></p>
      </header>

      <section id="feed" class="feed">
        <section class="filters">
          <h2 id="filter-category-label" class="filter-label">Category</h2>
          <div id="category-filters" class="chip-row"></div>
          <h2 id="filter-source-label" class="filter-label">Source</h2>
          <div id="source-filters" class="chip-row"></div>
        </section>

        <main id="stories" class="stories"></main>
        <p id="empty" class="empty hidden">No stories match the filters.</p>
      </section>

      <section id="detail" class="detail hidden" aria-live="polite">
        <button type="button" id="detail-back" class="detail-back">← Back</button>
        <article class="card detail-card">
          <div class="card-meta">
            <span id="detail-category" class="badge"></span>
            <span id="detail-source" class="source"></span>
          </div>
          <h2 id="detail-title" class="card-title"></h2>
          <div id="detail-body" class="detail-body"></div>
          <a id="detail-link" class="card-link" href="#" target="_blank" rel="noopener noreferrer"></a>
        </article>
      </section>

      <p id="error" class="error hidden"></p>

      <footer class="site-footer">
        <p class="site-footer-label">Telegram channels</p>
        <p class="site-footer-links">
          <a href="https://t.me/dayessence_en" rel="noopener noreferrer">World News · Day Essence</a>
          <span aria-hidden="true"> · </span>
          <a href="https://t.me/dayessence_ru" rel="noopener noreferrer">Мировые новости · Суть дня</a>
        </p>
      </footer>
    </div>
    <script src="app.js" type="module"></script>
  </body>
</html>
