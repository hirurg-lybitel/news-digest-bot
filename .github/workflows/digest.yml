name: Daily News Digest

on:
  # schedule:
  #   # 06:17 UTC (09:17 Minsk) and 18:17 UTC (21:17 Minsk)
  #   - cron: "17 6 * * *"
  #   - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run digest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_SECURITY_KEY: ${{ secrets.OPENAI_SECURITY_KEY }}
          OPENAI_PROJECT_KEY: ${{ secrets.OPENAI_PROJECT_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID_RU: ${{ secrets.TELEGRAM_CHANNEL_ID_RU }}
          TELEGRAM_CHANNEL_ID_EN: ${{ secrets.TELEGRAM_CHANNEL_ID_EN }}
          MINI_APP_URL: ${{ vars.MINI_APP_URL }}
          TELEGRAM_BOT_USERNAME: ${{ vars.TELEGRAM_BOT_USERNAME }}
          MINI_APP_SHORT_NAME: ${{ vars.MINI_APP_SHORT_NAME }}
          OPENAI_MODEL: gpt-4o-mini
          DIGEST_TOP_N: "10"
          MINI_APP_TOP_N: "30"
          DEFAULT_LOOKBACK_HOURS: "12"
          MAX_LOOKBACK_HOURS: "24"
        run: npm run digest

      # Pushes with GITHUB_TOKEN do not trigger other workflows (pages.yml),
      # so deploy Mini App from this job after committing data.
      - name: Commit mini app data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add miniapp/data/
          git diff --staged --quiet || git commit -m "Update digest data for mini app"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Mini App artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: miniapp

      - name: Deploy Mini App to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
